# Egress filter for the Claude sandbox (see bin/claude-docker).
# Default-deny: only domains in allowed-domains.txt are reachable,
# on ports 80/443, plus CONNECT tunnels to 443 and 22 (git over SSH).
http_port 3128
cache deny all
access_log stdio:/dev/stdout

acl allowed dstdomain "/etc/squid/allowed-domains.txt"
acl Safe_ports port 80 443 22
acl SSL_ports port 443 22
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all
